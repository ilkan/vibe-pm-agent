AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bedrock Agent Invocation Lambda with API Gateway and Cognito Auth'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  BedrockAgentId:
    Type: String
    Default: ULX1RJGKCR
    Description: Bedrock Agent ID
  BedrockAgentAliasId:
    Type: String
    Default: TSTALIASID
    Description: Bedrock Agent Alias ID
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_gFn54IyZ5
    Description: Cognito User Pool ID for authorization

Resources:
  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'InvokeBedrockAgentRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAgentAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                  - bedrock-agent:InvokeAgent
                  - bedrock-agent-runtime:InvokeAgent
                  - bedrock-runtime:InvokeModel
                Resource: '*'

  # Lambda Function
  InvokeBedrockAgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'invoke-bedrock-agent-${Environment}'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
          BEDROCK_AGENT_ID: !Ref BedrockAgentId
          BEDROCK_AGENT_ALIAS_ID: !Ref BedrockAgentAliasId
      Code:
        ZipFile: |
          const { BedrockAgentRuntimeClient, InvokeAgentCommand } = require("@aws-sdk/client-bedrock-agent-runtime");

          const client = new BedrockAgentRuntimeClient({ 
            region: process.env.AWS_REGION || 'us-east-1' 
          });

          // CORS headers for web requests
          const corsHeaders = {
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Headers': 'Content-Type,Authorization',
            'Access-Control-Allow-Methods': 'POST,OPTIONS'
          };

          exports.handler = async (event) => {
            console.log('Event:', JSON.stringify(event, null, 2));

            // Handle CORS preflight
            if (event.httpMethod === 'OPTIONS') {
              return {
                statusCode: 200,
                headers: corsHeaders,
                body: ''
              };
            }

            try {
              // Parse request body
              const body = typeof event.body === 'string' ? JSON.parse(event.body) : event.body;
              const { text, sessionId, enableTrace = false } = body;

              if (!text) {
                return {
                  statusCode: 400,
                  headers: corsHeaders,
                  body: JSON.stringify({ error: 'Missing required field: text' })
                };
              }

              // Generate session ID if not provided
              const finalSessionId = sessionId || `web-session-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

              console.log(`Invoking Bedrock Agent with text: "${text}" and sessionId: "${finalSessionId}"`);

              const command = new InvokeAgentCommand({
                agentId: process.env.BEDROCK_AGENT_ID,
                agentAliasId: process.env.BEDROCK_AGENT_ALIAS_ID || 'TSTALIASID',
                sessionId: finalSessionId,
                inputText: text,
                enableTrace: enableTrace
              });

              const response = await client.send(command);
              
              // Process the response stream
              let fullResponse = '';
              let traces = [];
              
              if (response.completion) {
                for await (const chunk of response.completion) {
                  if (chunk.chunk && chunk.chunk.bytes) {
                    const chunkText = new TextDecoder().decode(chunk.chunk.bytes);
                    fullResponse += chunkText;
                  }
                  
                  if (chunk.trace && enableTrace) {
                    traces.push(chunk.trace);
                  }
                }
              }

              const result = {
                response: fullResponse,
                sessionId: finalSessionId,
                agentId: process.env.BEDROCK_AGENT_ID,
                timestamp: new Date().toISOString()
              };

              if (enableTrace && traces.length > 0) {
                result.traces = traces;
              }

              return {
                statusCode: 200,
                headers: {
                  ...corsHeaders,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(result)
              };

            } catch (error) {
              console.error('Error invoking Bedrock Agent:', error);
              
              return {
                statusCode: 500,
                headers: corsHeaders,
                body: JSON.stringify({ 
                  error: 'Failed to invoke Bedrock Agent',
                  message: error.message,
                  timestamp: new Date().toISOString()
                })
              };
            }
          };

  # API Gateway
  BedrockAgentApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'bedrock-agent-api-${Environment}'
      Description: 'Bedrock Agent API for web UI'
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource
  InvokeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BedrockAgentApi
      ParentId: !GetAtt BedrockAgentApi.RootResourceId
      PathPart: invoke

  # Cognito Authorizer
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoAuthorizer
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref BedrockAgentApi
      ProviderARNs:
        - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
      IdentitySource: method.request.header.Authorization

  # POST Method
  PostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BedrockAgentApi
      ResourceId: !Ref InvokeResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InvokeBedrockAgentFunction.Arn}/invocations'

  # OPTIONS Method for CORS
  OptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BedrockAgentApi
      ResourceId: !Ref InvokeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InvokeBedrockAgentFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${BedrockAgentApi}/*/*'

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PostMethod
      - OptionsMethod
    Properties:
      RestApiId: !Ref BedrockAgentApi
      StageName: !Ref Environment

Outputs:
  ApiGatewayUrl:
    Description: 'API Gateway endpoint URL'
    Value: !Sub 'https://${BedrockAgentApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
  
  LambdaFunctionArn:
    Description: 'Lambda Function ARN'
    Value: !GetAtt InvokeBedrockAgentFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'