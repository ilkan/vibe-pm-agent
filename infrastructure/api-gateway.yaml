                  type: boolean
                data:
                  type: object
                requestId:
                  type: string
                toolName:
                  type: string
                executionTime:
                  type: number

  # Lambda permission for API Gateway
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunctionArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

Outputs:
  ApiGatewayUrl:
    Description: URL of the API Gateway
    Value: !Sub "https://${VibePMAgentAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${Environment}-vibe-pm-agent-api-url"

  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref VibePMAgentAPI
    Export:
      Name: !Sub "${Environment}-vibe-pm-agent-api-id"
