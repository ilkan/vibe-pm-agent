AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API Gateway for Vibe PM Agent Lambda Functions

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name

  LambdaFunctionArn:
    Type: String
    Description: ARN of the main Lambda function

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  # Main API Gateway REST API
  VibePMAgentAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${Environment}-vibe-pm-agent-api"
      StageName: !Ref Environment
      Description: API Gateway for Vibe PM Agent with 32 PM-focused tools
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Vibe PM Agent API
          description: API for Product Management tools and business intelligence
          version: "2.0.0"
        paths:
          # Business Analysis Tools (8 tools)
          /business-analysis/analyze-opportunity:
            post:
              summary: Analyze business opportunity
              operationId: analyzeBusinessOpportunity
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/BusinessAnalysisRequest"
              responses:
                "200":
                  description: Success response
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/BusinessAnalysisResponse"
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"

          /business-analysis/generate-case:
            post:
              summary: Generate business case
              operationId: generateBusinessCase
              requestBody:
                required: true
