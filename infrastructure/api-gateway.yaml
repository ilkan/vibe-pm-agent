                    - generate_interview_question
                    - evaluate_interview_response
                    - get_interview_feedback
                    - get_company_interview_insights
                    - customize_preparation_for_company
                toolArgs:
                  type: object

            InterviewPrepResponse:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                requestId:
                  type: string
                toolName:
                  type: string
                executionTime:
