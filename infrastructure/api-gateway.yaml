        components:
          schemas:
            BusinessAnalysisRequest:
              type: object
              required:
                - toolName
                - toolArgs
              properties:
                toolName:
                  type: string
                  enum:
                    - analyze_business_opportunity
                    - generate_business_case
                    - assess_strategic_alignment
                    - optimize_resource_allocation
                    - validate_market_timing
                    - validate_idea_quick
                    - analyze_competitor_landscape
                    - calculate_market_sizing
                toolArgs:
                  type: object
                  description: Arguments specific to the tool

            BusinessAnalysisResponse:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                requestId:
                  type: string
                toolName:
                  type: string
                executionTime:
                  type: number

            CommunicationsRequest:
              type: object
              required:
                - toolName
                - toolArgs
              properties:
                toolName:
                  type: string
                  enum:
                    - create_stakeholder_communication
                    - generate_management_onepager
                    - generate_pr_faq
                    - generate_board_presentation
