apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvidia-nim-llama
  namespace: nvidia-nim
  labels:
    app: nvidia-nim-llama
    component: inference-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nvidia-nim-llama
  template:
    metadata:
      labels:
        app: nvidia-nim-llama
        component: inference-engine
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: g5.xlarge
        nvidia.com/gpu.present: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: nim-llama
        image: nvcr.io/nim/meta/llama-3.1-nemotron-nano-8b-v1:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: NIM_CACHE_PATH
          value: "/opt/nim/.cache"
        - name: NIM_MODEL_PROFILE
          value: "llama-3.1-nemotron-nano-8b-v1"
        - name: NIM_SERVER_PORT
          value: "8000"
        - name: NIM_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: nim-secrets
              key: openai-api-key
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "8Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
        - name: nim-cache
          mountPath: /opt/nim/.cache
        - name: model-store
          mountPath: /opt/nim/models
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: nim-cache
        persistentVolumeClaim:
          claimName: nim-cache-pvc
      - name: model-store
        persistentVolumeClaim:
          claimName: nim-model-store-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvidia-nim-embedding
  namespace: nvidia-nim
  labels:
    app: nvidia-nim-embedding
    component: embedding-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nvidia-nim-embedding
  template:
    metadata:
      labels:
        app: nvidia-nim-embedding
        component: embedding-engine
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: g5.xlarge
        nvidia.com/gpu.present: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: nim-embedding
        image: nvcr.io/nim/nvidia/nv-embedqa-e5-v5:latest
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: NIM_CACHE_PATH
          value: "/opt/nim/.cache"
        - name: NIM_SERVER_PORT
          value: "8001"
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "1"
            memory: "4Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "8Gi"
        volumeMounts:
        - name: nim-cache
          mountPath: /opt/nim/.cache
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: nim-cache
        persistentVolumeClaim:
          claimName: nim-embedding-cache-pvc