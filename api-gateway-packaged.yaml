                    application/json:
                      schema:
                        $ref: '#/components/schemas/ErrorResponse'
                '403':
                  description: Forbidden - API key lacks required permissions
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ErrorResponse'
              x-amazon-apigateway-integration:
                type: aws_proxy
