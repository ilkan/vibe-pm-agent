AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: API Gateway for Vibe PM Agent Lambda Functions
Conditions:
  ExternalAccessEnabled:
    Fn::Equals:
    - Ref: ExternalAccessEnabled
    - 'true'
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod
    Description: Environment name
  LambdaFunctionArn:
    Type: String
    Description: ARN of the main Lambda function
  ExternalAccessEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Enable external access with API key authentication
Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'"
      AllowOrigin: "'*'"
      AllowCredentials: false
      MaxAge: "'600'"
Resources:
  VibePMAgentAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-vibe-pm-agent-api
      StageName:
        Ref: Environment
      Description: API Gateway for Vibe PM Agent with 32 PM-focused tools
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: "{\n  \"error\": {\n    \"code\": \"UNAUTHORIZED\",\n\
              \    \"message\": \"Invalid or missing API key\",\n    \"timestamp\"\
              : \"$context.requestTime\",\n    \"requestId\": \"$context.requestId\"\
              \n  }\n}\n"
        FORBIDDEN:
          StatusCode: 403
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: "{\n  \"error\": {\n    \"code\": \"FORBIDDEN\",\n \
              \   \"message\": \"API key lacks required permissions\",\n    \"timestamp\"\
              : \"$context.requestTime\",\n    \"requestId\": \"$context.requestId\"\
              \n  }\n}\n"
        THROTTLED:
          StatusCode: 429
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              Retry-After: "'60'"
          ResponseTemplates:
            application/json: "{\n  \"error\": {\n    \"code\": \"RATE_LIMIT_EXCEEDED\"\
              ,\n    \"message\": \"Rate limit exceeded. Please try again later.\"\
              ,\n    \"timestamp\": \"$context.requestTime\",\n    \"requestId\":\
              \ \"$context.requestId\",\n    \"retryAfter\": 60\n  }\n}\n"
        QUOTA_EXCEEDED:
          StatusCode: 429
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: "{\n  \"error\": {\n    \"code\": \"QUOTA_EXCEEDED\"\
              ,\n    \"message\": \"Monthly quota exceeded. Please upgrade your plan\
              \ or wait for quota reset.\",\n    \"timestamp\": \"$context.requestTime\"\
              ,\n    \"requestId\": \"$context.requestId\"\n  }\n}\n"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Vibe PM Agent API
          description: API for Product Management tools and business intelligence
          version: 2.0.0
        components:
          securitySchemes:
            ApiKeyAuth:
