  VibePMAgentAPIKey:
    Type: AWS::ApiGateway::ApiKey
    Condition: ExternalAccessEnabled
    Properties:
      Name:
        Fn::Sub: ${Environment}-vibe-pm-agent-api-key
      Description: API Key for external access to Vibe PM Agent
      Enabled: true
      StageKeys:
      - RestApiId:
          Ref: VibePMAgentAPI
        StageName:
          Ref: Environment
  VibePMAgentUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Condition: ExternalAccessEnabled
    Properties:
      UsagePlanName:
        Fn::Sub: ${Environment}-vibe-pm-agent-usage-plan
      Description: Usage plan for Vibe PM Agent external access
      ApiStages:
      - ApiId:
          Ref: VibePMAgentAPI
        Stage:
          Ref: Environment
      Throttle:
        RateLimit: 100
        BurstLimit: 200
      Quota:
        Limit: 10000
        Period: MONTH
  VibePMAgentUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Condition: ExternalAccessEnabled
    Properties:
      KeyId:
        Ref: VibePMAgentAPIKey
      KeyType: API_KEY
      UsagePlanId:
        Ref: VibePMAgentUsagePlan
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: LambdaFunctionArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
Outputs:
  ApiGatewayUrl:
    Description: URL of the API Gateway
    Value:
      Fn::Sub: https://${VibePMAgentAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${Environment}-vibe-pm-agent-api-url
  ApiGatewayId:
    Description: API Gateway ID
    Value:
      Ref: VibePMAgentAPI
    Export:
      Name:
        Fn::Sub: ${Environment}-vibe-pm-agent-api-id
  ApiKeyId:
    Condition: ExternalAccessEnabled
    Description: API Key ID for external access
    Value:
      Ref: VibePMAgentAPIKey
    Export:
      Name:
        Fn::Sub: ${Environment}-vibe-pm-agent-api-key-id
  ApiKeyValue:
    Condition: ExternalAccessEnabled
    Description: API Key value for external access (store securely)
    Value:
      Fn::GetAtt:
      - VibePMAgentAPIKey
      - Value
    Export:
      Name:
        Fn::Sub: ${Environment}-vibe-pm-agent-api-key-value
